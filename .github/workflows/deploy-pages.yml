name: Deploy Alex G Portfolio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static bundle with data and uploaded audio/covers
        run: |
          mkdir -p _site
          cp -r public/* _site/
          mkdir -p _site/data
          cp -r data/db.json _site/data/db.json
          if [ -d "uploads" ]; then
            mkdir -p _site/uploads
            cp -r uploads/* _site/uploads/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
